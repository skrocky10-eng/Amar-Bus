name: Build Complete AmarBus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Resources, Clean Patch, Firebase and Build APK
        run: |
          set -e
          ZIP_NAME=$(ls *.zip | head -n 1)
          echo "Extracting project from: $ZIP_NAME"
          unzip -o "$ZIP_NAME"

          # 1. Fetch live UPI from version.json
          NEW_UPI=$(curl -s "https://raw.githubusercontent.com/skrocky10-eng/Amar-Bus/main/version.json?t=$(date +%s)" | grep -o '"upiId": *"[^"]*"' | cut -d'"' -f4)
          if [ -z "$NEW_UPI" ]; then
            NEW_UPI="amarbus@upi"
          fi
          echo "Active UPI ID: $NEW_UPI"

          # 2. Patch Assets (JS safe, clean CSS hide rule)
          python3 -c '
          import os, glob

          # Block admin and update UPI in JS
          js_files = glob.glob("android/app/src/main/assets/dist/assets/*.js")
          new_upi = "'"$NEW_UPI"'"
          for jf in js_files:
              with open(jf, "r", encoding="utf-8", errors="ignore") as f:
                  data = f.read()
              mod = False

              if "#admin" in data:
                  data = data.replace("\"#admin\"", "\"__BLOCKED_ADMIN_PANEL_KEY__\"")
                  data = data.replace("\x27#admin\x27", "\x27__BLOCKED_ADMIN_PANEL_KEY__\x27")
                  data = data.replace("#admin", "__BLOCKED_ADMIN_PANEL_KEY__")
                  mod = True

              if "amarbus@upi" in data and new_upi:
                  data = data.replace("amarbus@upi", new_upi)
                  mod = True

              if mod:
                  with open(jf, "w", encoding="utf-8") as f:
                      f.write(data)

          # CSS Hide rule
          css_files = glob.glob("android/app/src/main/assets/dist/assets/*.css")
          hide_css = """
          button:has-text("Report Actual Bus Time"),
          button:has-text("Report"),
          [onclick*="Report"],
          .report-btn,
          div:has(> button:has-text("Report")),
          div:has(> button:has-text("Report Actual Bus Time")) {
              display: none !important;
              visibility: hidden !important;
              height: 0 !important;
              margin: 0 !important;
              padding: 0 !important;
              pointer-events: none !important;
          }
          """
          for cf in css_files:
              with open(cf, "a", encoding="utf-8") as f:
                  f.write("\n" + hide_css + "\n")
          '

          cd android

          # 3. Attach google-services.json
          if [ -f "../google-services.json" ]; then
            cp "../google-services.json" app/google-services.json
            echo "google-services.json attached successfully"
          fi

          # 4. Patch Gradle cleanly (Detect .kts or Groovy)
          python3 -c '
          import os

          # Root build file patch
          root_file = "build.gradle.kts" if os.path.exists("build.gradle.kts") else "build.gradle"
          if os.path.exists(root_file):
              with open(root_file, "r") as f:
                  content = f.read()
              if "com.google.gms:google-services" not in content and "com.google.gms.google-services" not in content:
                  if "plugins {" in content:
                      content = content.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\") version \"4.4.1\" apply false")
                  else:
                      content = "buildscript {\n    dependencies {\n        classpath(\"com.google.gms:google-services:4.4.1\")\n    }\n}\n" + content
                  with open(root_file, "w") as f:
                      f.write(content)
                  print("Patched root:", root_file)

          # App build file patch
          app_file = "app/build.gradle.kts" if os.path.exists("app/build.gradle.kts") else "app/build.gradle"
          if os.path.exists(app_file):
              with open(app_file, "r") as f:
                  content = f.read()

              # Add plugin
              if "com.google.gms.google-services" not in content:
                  if "plugins {" in content:
                      if "kts" in app_file:
                          content = content.replace("plugins {", "plugins {\n    id(\"com.google.gms.google-services\")")
                      else:
                          content = content.replace("plugins {", "plugins {\n    id \"com.google.gms.google-services\"")

              # Add dependencies
              if "firebase-analytics" not in content:
                  if "dependencies {" in content:
                      if "kts" in app_file:
                          dep_block = "dependencies {\n    implementation(platform(\"com.google.firebase:firebase-bom:32.8.0\"))\n    implementation(\"com.google.firebase:firebase-analytics\")"
                      else:
                          dep_block = "dependencies {\n    implementation platform(\x27com.google.firebase:firebase-bom:32.8.0\x27)\n    implementation \x27com.google.firebase:firebase-analytics\x27"
                      content = content.replace("dependencies {", dep_block)

              with open(app_file, "w") as f:
                  f.write(content)
              print("Patched app:", app_file)
          '

          # 5. Setup Gradle Wrapper
          gradle wrapper --gradle-version 8.4 --distribution-type bin

          # 6. Resource folders setup
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable

          # 7. Custom App Icon setup
          ICON_FILE=""
          if [ -f "../app_icon.png" ]; then
            ICON_FILE="../app_icon.png"
          elif [ -f "../app_icon.jpg" ]; then
            ICON_FILE="../app_icon.jpg"
          fi

          if [ -n "$ICON_FILE" ]; then
            cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            rm -rf app/src/main/res/mipmap-anydpi-v26
          else
            mkdir -p app/src/main/res/mipmap-anydpi-v26
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1B5E20" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_background"/>
          </adaptive-icon>
          EOF
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          # 8. AndroidManifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AmarBus">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:theme="@style/Theme.AmarBus">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # 9. MainActivity with Firebase
          mkdir -p app/src/main/java/com/amarbus/app
          cat << 'EOF' > app/src/main/java/com/amarbus/app/MainActivity.kt
          package com.amarbus.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.google.firebase.analytics.FirebaseAnalytics
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class MainActivity : ComponentActivity() {
              private lateinit var webView: WebView
              private lateinit var firebaseAnalytics: FirebaseAnalytics
              private val PERMISSION_REQUEST_CODE = 1001

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)

                  try {
                      firebaseAnalytics = FirebaseAnalytics.getInstance(this)
                      val bundle = Bundle().apply {
                          putString("screen_name", "MainMapScreen")
                      }
                      firebaseAnalytics.logEvent(FirebaseAnalytics.Event.APP_OPEN, bundle)
                  } catch (ignored: Exception) {}

                  checkRemoteUpdate()
                  checkPermissions()

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      allowFileAccessFromFileURLs = true
                      allowUniversalAccessFromFileURLs = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      mediaPlaybackRequiresUserGesture = false
                  }

                  webView.scrollBarStyle = View.SCROLLBARS_INSIDE_OVERLAY

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest?) {
                          runOnUiThread {
                              request?.grant(request.resources)
                          }
                      }
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {
                          if (url == null) return false

                          if (url.startsWith("intent://") || url.startsWith("https://www.google.com/maps") || url.startsWith("https://maps.google.com")) {
                              try {
                                  val intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME)

                               
