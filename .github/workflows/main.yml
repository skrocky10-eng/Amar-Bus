name: Build Complete AmarBus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Resources, Clean Patch, Firebase and Build APK
        run: |
          set -e
          ZIP_NAME=$(ls *.zip | head -n 1)
          echo "Extracting project from: $ZIP_NAME"
          unzip -o "$ZIP_NAME"

          # 1. Fetch live UPI from version.json
          NEW_UPI=$(curl -s "https://raw.githubusercontent.com/skrocky10-eng/Amar-Bus/main/version.json?t=$(date +%s)" | grep -o '"upiId": *"[^"]*"' | cut -d'"' -f4)
          if [ -z "$NEW_UPI" ]; then
            NEW_UPI="amarbus@upi"
          fi
          echo "Active UPI ID: $NEW_UPI"

          # 2. Patch Assets (JS ko bina chhede clean CSS hide rule)
          python3 -c '
          import os, glob

          # A. Block #admin and replace UPI directly inside JS bundles
          js_files = glob.glob("android/app/src/main/assets/dist/assets/*.js")
          new_upi = "'"$NEW_UPI"'"
          for jf in js_files:
              with open(jf, "r", encoding="utf-8", errors="ignore") as f:
                  data = f.read()
              mod = False

              if "#admin" in data:
                  data = data.replace("\"#admin\"", "\"__BLOCKED_ADMIN_PANEL_KEY__\"")
                  data = data.replace("\x27#admin\x27", "\x27__BLOCKED_ADMIN_PANEL_KEY__\x27")
                  data = data.replace("#admin", "__BLOCKED_ADMIN_PANEL_KEY__")
                  mod = True

              if "amarbus@upi" in data and new_upi:
                  data = data.replace("amarbus@upi", new_upi)
                  mod = True

              if mod:
                  with open(jf, "w", encoding="utf-8") as f:
                      f.write(data)
                  print("Patched JS bundle cleanly:", jf)

          # B. Append hide rule to CSS bundles
          css_files = glob.glob("android/app/src/main/assets/dist/assets/*.css")
          hide_css = """
          button:has-text("Report Actual Bus Time"),
          button:has-text("Report"),
          [onclick*="Report"],
          .report-btn,
          div:has(> button:has-text("Report")),
          div:has(> button:has-text("Report Actual Bus Time")) {
              display: none !important;
              visibility: hidden !important;
              height: 0 !important;
              margin: 0 !important;
              padding: 0 !important;
              pointer-events: none !important;
          }
          """
          for cf in css_files:
              with open(cf, "a", encoding="utf-8") as f:
                  f.write("\n" + hide_css + "\n")
              print("Appended clean hide rule into CSS bundle:", cf)
          '

          cd android

          # 3. Setup google-services.json for Firebase
          if [ -f "../google-services.json" ]; then
            cp "../google-services.json" app/google-services.json
            echo "Successfully attached google-services.json"
          fi

          # 4. Integrate Firebase Analytics in build.gradle
          # Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
                  classpath 'com.google.gms:google-services:4.4.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.amarbus.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.amarbus.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ""
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:32.8.0')
              implementation 'com.google.firebase:firebase-analytics'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.activity:activity-ktx:1.8.2'
          }
          EOF

          # 5. Setup Gradle Wrapper
          gradle wrapper --gradle-version 8.4 --distribution-type bin

          # 6. Resource folders setup
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable

          # 7. Custom App Icon setup
          ICON_FILE=""
          if [ -f "../app_icon.png" ]; then
            ICON_FILE="../app_icon.png"
          elif [ -f "../app_icon.jpg" ]; then
            ICON_FILE="../app_icon.jpg"
          fi

          if [ -n "$ICON_FILE" ]; then
            cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            rm -rf app/src/main/res/mipmap-anydpi-v26
          else
            mkdir -p app/src/main/res/mipmap-anydpi-v26
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1B5E20" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_background"/>
          </adaptive-icon>
          EOF
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          # 8. AndroidManifest with Permissions
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AmarBus">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:theme="@style/Theme.AmarBus">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # 9. MainActivity with Official Firebase SDK Integration
          mkdir -p app/src/main/java/com/amarbus/app
          cat << 'EOF' > app/src/main/java/com/amarbus/app/MainActivity.kt
          package com.amarbus.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.google.firebase.analytics.FirebaseAnalytics
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class MainActivity : ComponentActivity() {
              private lateinit var webView: WebView
              private lateinit var firebaseAnalytics: FirebaseAnalytics
              private val PERMISSION_REQUEST_CODE = 1001

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)

                  // Official Firebase Init & App Open Event
                  firebaseAnalytics = FirebaseAnalytics.getInstance(this)
                  val bundle = Bundle().apply {
                      putString("screen_name", "MainMapScreen")
                  }
                  firebaseAnalytics.logEvent(FirebaseAnalytics.Event.APP_OPEN, bundle)

                  checkRemoteUpdate()
                  checkPermissions()

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      allowFileAccessFromFileURLs = true
                      allowUniversalAccessFromFileURLs = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      mediaPlaybackRequiresUserGesture = false
                  }

                  webView.scrollBarStyle = View.SCROLLBARS_INSIDE_OVERLAY

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest?) {
                          runOnUiThread {
                              request?.grant(request.resources)
                          }
                      }
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {
                          if (url == null) return false

                          if (url.startsWith("intent://") || url.startsWith("https://www.google.com/maps") || url.startsWith("https://maps.google.com")) {
                              try {
                                  val intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME)
                                  if (intent != null) {
                                      view?.context?.startActivity(intent)
                                      return true
                                  }
                              } catch (e: Exception) {
                                  try {
                                      val fallbackUrl = url.replace("intent://", "https://")
                                      val browserIntent = Intent(Intent.ACTION_VIEW, Uri.parse(fallbackUrl))
                                      view?.context?.startActivity(browserIntent)
                                      return true
                                  } catch (ignored: Exception) {}
                              }
                          } else if (url.startsWith("tel:") || url.startsWith("mailto:") || url.startsWith("geo:") || url.startsWith("upi:")) {
                              val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url))
                              view?.context?.startActivity(intent)
                              return true
                          }

                          url.let { view?.loadUrl(it) }
                          return true
                      }
                  }

                  webView.loadUrl("file:///android_asset/dist/index.html")
              }

              private fun checkRemoteUpdate() {
                  thread {
                      try {
                          val endpoint = "https://raw.githubusercontent.com/skrocky10-eng/Amar-Bus/main/version.json?t=" + System.currentTimeMillis()
                          val url = URL(endpoint)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.connectTimeout = 4000
                          conn.readTimeout = 4000
                          val resp = conn.inputStream.bufferedReader().use { it.readText() }
                          val json = JSONObject(resp)

                          val hasUpdate = json.optBoolean("hasUpdate", false)
                          val latestVer = json.optInt("latestVersion", 1)
                          val title = json.optString("title", "Update Available")
                          val message = json.optString("message", "Amar Bus app ka naya version uplabdh hai.")
                          val updateUrl = json.optString("updateUrl", "")

                          if (hasUpdate && latestVer > 1 && updateUrl.isNotEmpty()) {
                              runOnUiThread {
                                  try {
                                      AlertDialog.Builder(this)
                                          .setTitle(title)
                                          .setMessage(message)
                                          .setCancelable(false)
                                          .setPositiveButton("Update Now") { _, _ ->
                                              val browserIntent = Intent(Intent.ACTION_VIEW, Uri.parse(updateUrl))
                                              startActivity(browserIntent)
                                          }
                                          .show()
                                  } catch (ignored: Exception) {}
                              }
                          }
                      } catch (ignored: Exception) {}
                  }
              }

              private fun checkPermissions() {
                  val permissionsNeeded = mutableListOf<String>()
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      permissionsNeeded.add(Manifest.permission.RECORD_AUDIO)
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      permissionsNeeded.add(Manifest.permission.ACCESS_FINE_LOCATION)
                  }
                  if (permissionsNeeded.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, permissionsNeeded.toTypedArray(), PERMISSION_REQUEST_CODE)
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                      return
                  }
                  super.onBackPressed()
              }
          }
          EOF

          # 10. Compile APK
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amarbus-complete-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
