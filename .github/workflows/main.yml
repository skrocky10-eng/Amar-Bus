name: Build Complete AmarBus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Patch Native Kotlin Code and Build APK
        run: |
          set -e
          ZIP_NAME=$(ls *.zip | head -n 1)
          echo "Extracting project from: $ZIP_NAME"
          unzip -o "$ZIP_NAME"

          # 1. Fetch live UPI from version.json
          NEW_UPI=$(curl -s "https://raw.githubusercontent.com/skrocky10-eng/Amar-Bus/main/version.json?t=$(date +%s)" | grep -o '"upiId": *"[^"]*"' | cut -d'"' -f4)
          if [ -z "$NEW_UPI" ]; then
            NEW_UPI="amarbus@upi"
          fi
          echo "Applying Native UPI: $NEW_UPI"

          # 2. Patch Native Kotlin files directly using Python
          python3 -c '
          import os, glob

          kt_files = glob.glob("android/app/src/main/java/com/amarbus/app/**/*.kt", recursive=True)
          new_upi = "'"$NEW_UPI"'"

          for kf in kt_files:
              with open(kf, "r", encoding="utf-8", errors="ignore") as f:
                  code = f.read()
              
              orig = code
              
              # A. Replace hardcoded UPI ID
              if "amarbus@upi" in code:
                  code = code.replace("amarbus@upi", new_upi)
                  print(f"Replaced UPI in: {kf}")

              # B. Disable #admin trigger in native search query
              if "#admin" in code:
                  code = code.replace("#admin", "#disabled_admin_entry")
                  print(f"Disabled #admin in: {kf}")

              # C. Remove "Report Actual Bus Time" composable blocks/buttons
              if "Report Actual Bus Time" in code:
                  # Replace the string or button label so it never displays
                  code = code.replace("\"Report Actual Bus Time\"", "\"\"")
                  print(f"Removed Report button text in: {kf}")

              if code != orig:
                  with open(kf, "w", encoding="utf-8") as f:
                      f.write(code)
          '

          cd android

          # 3. Setup official Gradle Wrapper
          gradle wrapper --gradle-version 8.4 --distribution-type bin

          # 4. Custom App Icon setup
          ICON_FILE=""
          if [ -f "../app_icon.png" ]; then
            ICON_FILE="../app_icon.png"
          elif [ -f "../app_icon.jpg" ]; then
            ICON_FILE="../app_icon.jpg"
          fi

          if [ -n "$ICON_FILE" ]; then
            mkdir -p app/src/main/res/mipmap-hdpi
            mkdir -p app/src/main/res/mipmap-mdpi
            mkdir -p app/src/main/res/mipmap-xhdpi
            mkdir -p app/src/main/res/mipmap-xxhdpi
            mkdir -p app/src/main/res/mipmap-xxxhdpi

            cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            rm -rf app/src/main/res/mipmap-anydpi-v26
          fi

          # 5. Build native APK
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amarbus-complete-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
