name: Build Complete AmarBus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Resources, Clean Patch and Build APK
        run: |
          set -e
          ZIP_NAME=$(ls *.zip | head -n 1)
          echo "Extracting project from: $ZIP_NAME"
          unzip -o "$ZIP_NAME"

          # 1. Fetch live UPI from version.json
          NEW_UPI=$(curl -s "https://raw.githubusercontent.com/skrocky10-eng/Amar-Bus/main/version.json?t=$(date +%s)" | grep -o '"upiId": *"[^"]*"' | cut -d'"' -f4)
          if [ -z "$NEW_UPI" ]; then
            NEW_UPI="amarbus@upi"
          fi
          echo "Active UPI ID: $NEW_UPI"

          # 2. Comprehensive Patching (JS Bundles + CSS)
          python3 -c '
          import os, glob

          # A. Strip Report Text, Lock Admin & Update UPI in all JS chunks
          js_files = glob.glob("android/app/src/main/assets/dist/assets/*.js")
          new_upi = "'"$NEW_UPI"'"
          for jf in js_files:
              with open(jf, "r", encoding="utf-8", errors="ignore") as f:
                  data = f.read()
              mod = False

              if "#admin" in data:
                  data = data.replace("\"#admin\"", "\"__PERMANENTLY_BLOCKED_ADMIN__\"")
                  data = data.replace("\x27#admin\x27", "\x27__PERMANENTLY_BLOCKED_ADMIN__\x27")
                  data = data.replace("#admin", "__PERMANENTLY_BLOCKED_ADMIN__")
                  mod = True

              if "amarbus@upi" in data and new_upi:
                  data = data.replace("amarbus@upi", new_upi)
                  mod = True

              report_texts = [
                  "Report Actual Bus Time at a Stop",
                  "Report Actual Bus Time",
                  "Report Bus Time"
              ]
              for rt in report_texts:
                  if rt in data:
                      data = data.replace(rt, "")
                      mod = True

              if mod:
                  with open(jf, "w", encoding="utf-8") as f:
                      f.write(data)
                  print("Patched JS bundle cleanly:", jf)

          # B. Append absolute CSS rules to ALL css bundles
          css_files = glob.glob("android/app/src/main/assets/dist/assets/*.css")
          hide_css = """
          button:empty,
          a:empty,
          button:has-text("Report"),
          button:has(svg + span:empty),
          [class*="report"],
          [id*="report"],
          div:has(> button:empty) {
              display: none !important;
              visibility: hidden !important;
              height: 0px !important;
              max-height: 0px !important;
              margin: 0px !important;
              padding: 0px !important;
              pointer-events: none !important;
              overflow: hidden !important;
          }
          """
          for cf in css_files:
              with open(cf, "a", encoding="utf-8") as f:
                  f.write("\n" + hide_css + "\n")
              print("Appended clean CSS hide rules to:", cf)
          '

          cd android

          # 3. Setup Gradle Wrapper
          gradle wrapper --gradle-version 8.4 --distribution-type bin

          # 4. Resource folders setup
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable

          # 5. App Icon Setup
          ICON_FILE=""
          if [ -f "../app_icon.png" ]; then
            ICON_FILE="../app_icon.png"
          elif [ -f "../app_icon.jpg" ]; then
            ICON_FILE="../app_icon.jpg"
          fi

          if [ -n "$ICON_FILE" ]; then
            cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            cp "$ICON_FILE" app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp "$ICON_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            rm -rf app/src/main/res/mipmap-anydpi-v26
          else
            mkdir -p app/src/main/res/mipmap-anydpi-v26
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1B5E20" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_background"/>
          </adaptive-icon>
          EOF
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          # 6. AndroidManifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AmarBus">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:theme="@style/Theme.AmarBus">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # 7. Stable MainActivity with 100% Compliant GA4 Measurement Protocol
          mkdir -p app/src/main/java/com/amarbus/app
          cat << 'EOF' > app/src/main/java/com/amarbus/app/MainActivity.kt
          package com.amarbus.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONObject
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.UUID
          import kotlin.concurrent.thread

          class MainActivity : ComponentActivity() {
              private lateinit var webView: WebView
              private val PERMISSION_REQUEST_CODE = 1001

              private val GA_MEASUREMENT_ID = "G-MDS74ENQJE"
              private val GA_API_SECRET = "ZMySZVn2QuWfuNw35s4FZQ"

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)

                  sendAnalyticsHit()
                  checkRemoteUpdate()
                  checkPermissions()

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      allowFileAccessFromFileURLs = true
                      allowUniversalAccessFromFileURLs = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      mediaPlaybackRequiresUserGesture = false
                  }

                  webView.scrollBarStyle = View.SCROLLBARS_INSIDE_OVERLAY

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest?) {
                          runOnUiThread {
                              request?.grant(request.resources)
                          }
                      }
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {
                          if (url == null) return false

                          if (url.startsWith("intent://") || url.startsWith("https://www.google.com/maps") || url.startsWith("https://maps.google.com")) {
                              try {
                                  val intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME)
                                  if (intent != null) {
                                      view?.context?.startActivity(intent)
                                      return true
                                  }
                              } catch (e: Exception) {
                                  try {
                                      val fallbackUrl = url.replace("intent://", "https://")
                                      val browserIntent = Intent(Intent.ACTION_VIEW, Uri.parse(fallbackUrl))
                                      view?.context?.startActivity(browserIntent)
                                      return true
                                  } catch (ignored: Exception) {}
                              }
                          } else if (url.startsWith("tel:") || url.startsWith("mailto:") || url.startsWith("geo:") || url.startsWith("upi:")) {
                              val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url))
                              view?.context?.startActivity(intent)
                              return true
                          }

                          url.let { view?.loadUrl(it) }
                          return true
                      }
                  }

                  webView.loadUrl("file:///android_asset/dist/index.html")
              }

              private fun checkRemoteUpdate() {
                  thread {
                      try {
                          val endpoint = "https://raw.githubusercontent.com/skrocky10-eng/Amar-Bus/main/version.json?t=" + System.currentTimeMillis()
                          val url = URL(endpoint)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.connectTimeout = 4000
                          conn.readTimeout = 4000
                          val resp = conn.inputStream.bufferedReader().use { it.readText() }
                          val json = JSONObject(resp)

                          val hasUpdate = json.optBoolean("hasUpdate", false)
                          val latestVer = json.optInt("latestVersion", 1)
                          val title = json.optString("title", "Update Available")
                          val message = json.optString("message", "Amar Bus app ka naya version uplabdh hai.")
                          val updateUrl = json.optString("updateUrl", "")

                          if (hasUpdate && latestVer > 1 && updateUrl.isNotEmpty()) {
                              runOnUiThread {
                                  try {
                                      AlertDialog.Builder(this)
                                          .setTitle(title)
                                          .setMessage(message)
                                          .setCancelable(false)
                                          .setPositiveButton("Update Now") { _, _ ->
                                              val browserIntent = Intent(Intent.ACTION_VIEW, Uri.parse(updateUrl))
                                              startActivity(browserIntent)
                                          }
                                          .show()
                                  } catch (ignored: Exception) {}
                              }
                          }
                      } catch (ignored: Exception) {}
                  }
              }

              private fun getOrCreateClientId(): String {
                  val prefs = getSharedPreferences("amarbus_analytics", Context.MODE_PRIVATE)
                  var clientId = prefs.getString("client_id", null)
                  if (clientId == null) {
                      clientId = UUID.randomUUID().toString()
                      prefs.edit().putString("client_id", clientId).apply()
                  }
                  return clientId
              }

              private fun sendAnalyticsHit() {
                  thread {
                      try {
                          val clientId = getOrCreateClientId()
                          val sessionId = System.currentTimeMillis() / 1000
                          val endpoint = "https://www.google-analytics.com/mp/collect?measurement_id=$GA_MEASUREMENT_ID&api_secret=$GA_API_SECRET"
                          val url = URL(endpoint)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Content-Type", "application/json; utf-8")
                          conn.doOutput = true
                          conn.connectTimeout = 5000
                          conn.readTimeout = 5000

                          val jsonBody = """
                          {
                            "client_id": "$clientId",
                            "events": [
                              {
                                "name": "page_view",
                                "params": {
                                  "session_id": $sessionId,
                                  "page_location": "https://amarbus.app/",
                                  "page_title": "Amar Bus App",
                                  "engagement_time_msec": 1500
                                }
                              },
                              {
                                "name": "user_engagement",
                                "params": {
                                  "session_id": $sessionId,
                                  "engagement_time_msec": 1500
                                }
                              }
                            ]
                          }
                          """.trimIndent()

                          OutputStreamWriter(conn.outputStream).use { writer ->
                              writer.write(jsonBody)
                              writer.flush()
                          }

                          conn.responseCode
                          conn.disconnect()
                      } catch (ignored: Exception) {}
                  }
              }

              private fun checkPermissions() {
                  val permissionsNeeded = mutableListOf<String>()
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      permissionsNeeded.add(Manifest.permission.RECORD_AUDIO)
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      permissionsNeeded.add(Manifest.permission.ACCESS_FINE_LOCATION)
                  }
                  if (permissionsNeeded.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, permissionsNeeded.toTypedArray(), PERMISSION_REQUEST_CODE)
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                      return
                  }
                  super.onBackPressed()
              }
          }
          EOF

          # 8. Compile APK
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amarbus-complete-apk
          path: '**/build/outputs/apk/debug/*.apk'
          
